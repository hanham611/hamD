<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>초등 감성 그림일기장</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <style>
        /* [핵심 교정] 새로 업로드해주신 중간 두께 크레파스 서체 파일(Typo_CrayonM.ttf)을 로드하도록 수정 */
        @font-face {
            font-family: 'Typo_CrayonM';
            src: url('./fonts/Typo_CrayonM.ttf') format('truetype');
            font-weight: 500;
            font-style: normal;
        }

        /* 웹사이트 전체 요소 및 내부 입력창, 격자 칸까지 새 크레파스 Medium 폰트 최우선 강제 지정 */
        * {
            font-family: 'Typo_CrayonM', sans-serif !important;
        }

        body {
            background-color: #f3f4f6;
            padding: 12px;
        }

        /* 그림일기장 공책 메인 프레임 */
        .notebook {
            background-color: #ffffff;
            box-shadow: 0 10px 30px rgba(0,0,0,0.06);
            border: 2px solid #e5e7eb;
            border-radius: 16px;
        }

        /* 정통 격자 원고지 칸 (중앙 십자 점선 가이드라인 포함 양식) */
        .grid-cell {
            aspect-ratio: 1 / 1;
            width: 100%;
            min-width: 0;
            border: 1px solid #fca5a5;
            position: relative;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-size: clamp(14px, 4vw, 24px);
            background-color: transparent;
            text-align: center;
            color: #1f2937;
        }
        
        /* 격자 내부 십자 가이드라인을 형성하는 가상 요소 기법 */
        .grid-cell::before {
            content: "";
            position: absolute;
            top: 50%;
            left: 0;
            width: 100%;
            border-top: 1px dashed #fee2e2;
            z-index: 0;
        }
        .grid-cell::after {
            content: "";
            position: absolute;
            top: 0;
            left: 50%;
            height: 100%;
            border-left: 1px dashed #fee2e2;
            z-index: 0;
        }
        .grid-cell span {
            position: relative;
            z-index: 1;
        }

        /* 가로 10칸 세로 5칸 (총 50칸 격자망) 컨테이너 */
        .grid-container {
            display: grid;
            grid-template-columns: repeat(10, 1fr);
            gap: 0px;
            width: 100%;
            max-width: 420px;
            margin: 0 auto;
            border: 1px solid #fca5a5;
        }

        /* 크레파스 팔레트 원형 컬러칩 */
        .color-btn {
            width: 26px;
            height: 26px;
            border-radius: 50%;
            border: 2px solid #ffffff;
            box-shadow: 0 0 0 1px #d1d5db;
            cursor: pointer;
            transition: transform 0.1s ease;
        }
        .color-btn:hover {
            transform: scale(1.15);
        }
        .color-btn.active {
            box-shadow: 0 0 0 2px #3b82f6;
        }

        /* 그리기 및 업로드 모드 컨트롤러 탭 버튼 스타일 */
        .tab-btn {
            padding: 8px 16px;
            border-radius: 8px;
            font-weight: bold;
            font-size: 14px;
            transition: all 0.2s;
        }
        .tab-btn.active {
            background-color: #4b5563;
            color: #ffffff;
        }
        .tab-btn.inactive {
            background-color: #e5e7eb;
            color: #4b5563;
        }
    #paintCanvas {
        width: 100%;
        max-width: 440px;
        aspect-ratio: 440 / 260;
        height: auto;
        }
    @media (max-width: 640px) {

    body {
        padding: 10px;
    }

    .notebook {
        padding: 12px !important;
    }

    .grid {
        grid-template-columns: 1fr !important;
    }

    .text-3xl {
        font-size: 1.4rem !important;
    }

    .text-2xl {
        font-size: 1.2rem !important;
    }

    .tab-btn {
        font-size: 12px;
        padding: 6px 10px;
    }

    .color-btn {
        width: 22px;
        height: 22px;
    }

    .grid-cell {
        font-size: 14px;
        }
        }
    </style>
</head>
<body class="text-stone-800 text-xl">

    <div class="max-w-xl mx-auto space-y-6">
        
        <div class="bg-white p-6 rounded-2xl shadow-sm border border-stone-200 space-y-4">
            <h2 class="text-2xl text-amber-800 font-bold">📝 오늘의 일기 작성하기</h2>
            
            <div class="grid grid-cols-2 gap-4 text-base">
                <div>
                    <label class="block text-stone-500 mb-1">날짜</label>
                    <input type="date" id="inputDate" class="w-full p-2 border border-stone-200 rounded-xl text-base">
                </div>
                <div>
                    <label class="block text-stone-500 mb-1">날씨</label>
                    <select id="inputWeather" class="w-full p-2 border border-stone-200 rounded-xl text-base">
                        <option value="☀️ 맑음">☀️ 맑음</option>
                        <option value="☁️ 흐림">☁️ 흐림</option>
                        <option value="☔ 비">☔ 비</option>
                        <option value="❄️ 눈">❄️ 눈</option>
                    </select>
                </div>
            </div>

            <div>
                <label class="block text-sm text-stone-500 mb-1">일기 제목</label>
                <input type="text" id="inputTitle" placeholder="제목을 입력하세요" class="w-full p-2 border border-stone-200 rounded-xl text-base">
            </div>

            <div>
                <div class="flex justify-between items-center mb-1">
                    <label class="block text-sm text-stone-500">일기 내용 (원고지 반영)</label>
                    <span id="charCounter" class="text-sm font-bold text-amber-700">(0 / 50자)</span>
                </div>
                <textarea id="inputContent" rows="3" maxlength="50" oninput="updateContent()" placeholder="오늘 있었던 일을 50자 이내로 적어보세요..." class="w-full p-2 border border-stone-200 rounded-xl text-base"></textarea>
            </div>

            <div class="space-y-3 border-t border-stone-100 pt-3">
                <div class="flex items-center justify-between">
                    <label class="block text-sm text-stone-500 font-bold">🖼️ 일기판 꾸미기 방식 선택</label>
                    <div class="flex gap-2">
                        <button type="button" id="tabDraw" onclick="switchMode('draw')" class="tab-btn active">🎨 직접 그리기</button>
                        <button type="button" id="tabUpload" onclick="switchMode('upload')" class="tab-btn inactive">📷 사진 업로드</button>
                    </div>
                </div>
                
                <div id="drawTools" class="space-y-2">
                    <div class="flex flex-wrap items-center gap-3 bg-stone-50 p-3 rounded-xl border border-stone-200">
                        <div class="flex gap-1.5" id="palette">
                            <div class="color-btn active" style="background-color: #000000;" onclick="changeColor('#000000', this)"></div>
                            <div class="color-btn" style="background-color: #ef4444;" onclick="changeColor('#ef4444', this)"></div>
                            <div class="color-btn" style="background-color: #f97316;" onclick="changeColor('#f97316', this)"></div>
                            <div class="color-btn" style="background-color: #eab308;" onclick="changeColor('#eab308', this)"></div>
                            <div class="color-btn" style="background-color: #22c55e;" onclick="changeColor('#22c55e', this)"></div>
                            <div class="color-btn" style="background-color: #3b82f6;" onclick="changeColor('#3b82f6', this)"></div>
                            <div class="color-btn" style="background-color: #a855f7;" onclick="changeColor('#a855f7', this)"></div>
                            <div class="color-btn" style="background-color: #ffffff;" onclick="changeColor('#ffffff', this)"></div>
                        </div>
                        
                        <div class="h-5 w-px bg-stone-300 mx-1"></div>

                        <div class="flex items-center gap-1 text-xs text-stone-600">
                            <span>두께</span>
                            <input type="range" id="lineWidth" min="4" max="25" value="10" class="w-20 accent-amber-700">
                        </div>

                        <button onclick="clearCanvas()" class="ml-auto text-xs bg-stone-200 hover:bg-stone-300 text-stone-700 px-2.5 py-1 rounded-md transition font-bold">
                            🧼 도화지 비우기
                        </button>
                    </div>
                </div>

                <div id="uploadTools" class="hidden">
                    <div class="bg-stone-50 p-4 rounded-xl border border-stone-200 text-sm flex flex-col gap-2">
                        <span class="text-stone-600 font-bold text-xs">📸 디바이스 내부의 보관 사진 불러오기</span>
                        <input type="file" id="imageSelector" accept="image/*" onchange="uploadImageToCanvas()" class="text-sm file:mr-4 file:py-2 file:px-4 file:rounded-full file:border-0 file:text-xs file:font-semibold file:bg-amber-50 file:text-amber-700 hover:file:bg-amber-100">
                    </div>
                </div>
            </div>

            <button onclick="applyAllData()" class="w-full bg-amber-700 text-white py-3 rounded-xl text-lg hover:bg-amber-800 transition shadow-sm font-bold">🎨 그림일기장 채우기</button>
        </div>

        <div id="diaryNotebook" class="notebook p-6 space-y-5" style="background-color: #ffffff;">
            
            <div class="grid grid-cols-2 border border-stone-300 text-xl text-center bg-stone-50/50 rounded-xl overflow-hidden">
                <div class="border-r border-stone-300 p-3">
                    <span id="viewDate">2026년 05월 25일 월요일</span>
                </div>
                <div class="p-3">
                    날씨: <span id="viewWeather" class="text-amber-800">☀️ 맑음</span>
                </div>
            </div>

            <div class="text-center text-3xl border-b-2 border-stone-300 pb-3 font-bold">
                제목: <span id="viewTitle" class="text-stone-600">-</span>
            </div>

            <div class="bg-stone-50 border border-stone-200 rounded-xl p-3 flex flex-col items-center justify-center relative">
                <canvas id="paintCanvas" class="bg-white rounded-lg shadow-sm cursor-crosshair border border-stone-200"></canvas>
            </div>

            <div class="py-4 bg-red-50/10 rounded-xl border border-red-100">
                <div id="gridContainer" class="grid-container">
                    </div>
            </div>

        </div>

        <button onclick="saveDiaryAsJpg()" class="w-full bg-stone-800 text-white py-4 rounded-xl text-lg hover:bg-stone-900 transition shadow-md font-bold">
            📸 내 그림일기 사진 파일로 저장하기 (.JPG)
        </button>

    </div>

    <script>
        let canvas, ctx;
        let isDrawing = false;
        let currentColor = '#000000';
        let lastX = 0;
        let lastY = 0;
        let currentMode = 'draw'; 

        window.onload = function() {
            renderGrid();
            initCanvas();
            
            const today = new Date();
            const year = today.getFullYear();
            const month = String(today.getMonth() + 1).padStart(2, '0');
            const day = String(today.getDate()).padStart(2, '0');
            document.getElementById('inputDate').value = `${year}-${month}-${day}`;
            applyAllData();
        };

        function switchMode(mode) {
            currentMode = mode;
            const tabDraw = document.getElementById('tabDraw');
            const tabUpload = document.getElementById('tabUpload');
            const drawTools = document.getElementById('drawTools');
            const uploadTools = document.getElementById('uploadTools');

            if (mode === 'draw') {
                tabDraw.className = 'tab-btn active';
                tabUpload.className = 'tab-btn inactive';
                drawTools.classList.remove('hidden');
                uploadTools.classList.add('hidden');
            } else {
                tabDraw.className = 'tab-btn inactive';
                tabUpload.className = 'tab-btn active';
                drawTools.classList.add('hidden');
                uploadTools.classList.remove('hidden');
            }
        }

        function renderGrid(text = "") {
            const container = document.getElementById('gridContainer');
            container.innerHTML = '';
            
            for (let i = 0; i < 50; i++) {
                const cell = document.createElement('div');
                cell.className = 'grid-cell';
                
                const charSpan = document.createElement('span');
                charSpan.innerText = text[i] || '';
                cell.appendChild(charSpan);
                
                container.appendChild(cell);
            }
        }

        function updateContent() {
            const contentTextArea = document.getElementById('inputContent');
            const counter = document.getElementById('charCounter');
            
            let text = contentTextArea.value;
            counter.innerText = `(${text.length} / 50자)`;
            renderGrid(text);
        }

        function initCanvas() {
            canvas = document.getElementById('paintCanvas');
            
            canvas.width = 440;
            canvas.height = 260;
            
            ctx = canvas.getContext('2d');
            
            ctx.fillStyle = '#ffffff';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            ctx.lineCap = 'round';
            ctx.lineJoin = 'round';

            canvas.addEventListener('mousedown', (e) => {
                if (currentMode !== 'draw') return;
                isDrawing = true;
                const rect = canvas.getBoundingClientRect();
                lastX = e.clientX - rect.left;
                lastY = e.clientY - rect.top;
                drawCrayon(lastX, lastY);
            });
            canvas.addEventListener('mousemove', (e) => {
                if (!isDrawing || currentMode !== 'draw') return;
                const rect = canvas.getBoundingClientRect();
                const x = e.clientX - rect.left;
                const y = e.clientY - rect.top;
                drawCrayonLine(lastX, lastY, x, y);
                lastX = x;
                lastY = y;
            });
            canvas.addEventListener('mouseup', () => isDrawing = false);
            canvas.addEventListener('mouseout', () => isDrawing = false);

            canvas.addEventListener('touchstart', (e) => {
                if (currentMode !== 'draw') return;
                isDrawing = true;
                const rect = canvas.getBoundingClientRect();
                const touch = e.touches[0];
                lastX = touch.clientX - rect.left;
                lastY = touch.clientY - rect.top;
                drawCrayon(lastX, lastY);
                e.preventDefault();
            });
            canvas.addEventListener('touchmove', (e) => {
                if (!isDrawing || currentMode !== 'draw') return;
                const rect = canvas.getBoundingClientRect();
                const touch = e.touches[0];
                const x = touch.clientX - rect.left;
                const y = touch.clientY - rect.top;
                drawCrayonLine(lastX, lastY, x, y);
                lastX = x;
                lastY = y;
                e.preventDefault();
            });
            canvas.addEventListener('touchend', () => isDrawing = false);
        }

        function drawCrayonLine(x1, y1, x2, y2) {
            const thickness = parseInt(document.getElementById('lineWidth').value);
            ctx.strokeStyle = currentColor;
            ctx.fillStyle = currentColor;

            const distance = Math.hypot(x2 - x1, y2 - y1);
            const steps = Math.max(Math.floor(distance / 1), 1);

            for (let i = 0; i <= steps; i++) {
                const t = i / steps;
                const cx = x1 + (x2 - x1) * t;
                const cy = y1 + (y2 - y1) * t;
                
                ctx.globalAlpha = 0.4;
                ctx.beginPath();
                ctx.arc(cx, cy, thickness / 2, 0, Math.PI * 2);
                ctx.fill();

                if (currentColor !== '#ffffff') { 
                    ctx.globalAlpha = 0.25;
                    for (let j = 0; j < thickness * 0.4; j++) {
                        const angle = Math.random() * Math.PI * 2;
                        const radius = Math.random() * (thickness / 2);
                        const px = cx + Math.cos(angle) * radius;
                        const py = cy + Math.sin(angle) * radius;
                        
                        ctx.beginPath();
                        ctx.arc(px, py, Math.random() * 1.5 + 0.5, 0, Math.PI * 2);
                        ctx.fill();
                    }
                }
            }
            ctx.globalAlpha = 1.0; 
        }

        function drawCrayon(x, y) {
            drawCrayonLine(x, y, x, y);
        }

        function uploadImageToCanvas() {
            const selector = document.getElementById('imageSelector');
            if (selector.files && selector.files[0]) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    const img = new Image();
                    img.onload = function() {
                        ctx.clearRect(0, 0, canvas.width, canvas.height);
                        ctx.fillStyle = '#ffffff';
                        ctx.fillRect(0, 0, canvas.width, canvas.height);
                        
                        const hRatio = canvas.width / img.width;
                        const vRatio = canvas.height / img.height;
                        const ratio  = Math.min(hRatio, vRatio);
                        const centerShift_x = (canvas.width - img.width * ratio) / 2;
                        const centerShift_y = (canvas.height - img.height * ratio) / 2;  
                        
                        ctx.drawImage(img, 0, 0, img.width, img.height, 
                                           centerShift_x, centerShift_y, img.width * ratio, img.height * ratio);
                    }
                    img.src = e.target.result;
                }
                reader.readAsDataURL(selector.files[0]);
            }
        }

        function changeColor(color, element) {
            currentColor = color;
            const buttons = document.querySelectorAll('.color-btn');
            buttons.forEach(btn => btn.classList.remove('active'));
            element.classList.add('active');
        }

        function clearCanvas() {
            ctx.fillStyle = '#ffffff';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            document.getElementById('imageSelector').value = ""; 
        }

        function applyAllData() {
            const title = document.getElementById('inputTitle').value || '오늘의 일기';
            const weather = document.getElementById('inputWeather').value;
            const rawDate = document.getElementById('inputDate').value;

            let dateString = "2026년 어느 날";
            if (rawDate) {
                const d = new Date(rawDate);
                const week = ['일', '월', '화', '수', '목', '금', '토'];
                dateString = `${d.getFullYear()}년 ${String(d.getMonth() + 1).padStart(2, '0')}월 ${String(d.getDate()).padStart(2, '0')}일 ${week[d.getDay()]}요일`;
            }

            document.getElementById('viewTitle').innerText = title;
            document.getElementById('viewWeather').innerText = weather;
            document.getElementById('viewDate').innerText = dateString;
            
            const content = document.getElementById('inputContent').value;
            renderGrid(content);
        }

        function saveDiaryAsJpg() {
            applyAllData();

            const diaryTarget = document.getElementById('diaryNotebook');
            
            html2canvas(diaryTarget, {
                scale: 2, 
                useCORS: true, 
                backgroundColor: '#ffffff' 
            }).then(canvasImage => {
                const link = document.createElement('a');
                const title = document.getElementById('inputTitle').value || '나의_그림일기장';
                const rawDate = document.getElementById('inputDate').value || '2026';
                
                link.download = `${title}_${rawDate}.jpg`;
                link.href = canvasImage.toDataURL('image/jpeg', 0.9); 
                link.click();
            }).catch(error => {
                alert('이미지 저장 중에 문제가 발생했습니다.');
                console.error(error);
            });
        }
    </script>
</body>
</html>
